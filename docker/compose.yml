name: fieldwork-commerce
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: commerce
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-commerce_dev}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U commerce -d commerce"]
      interval: 5s
      retries: 15
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    command:
      [
        redis-server,
        --appendonly,
        "yes",
        --maxmemory,
        128mb,
        --maxmemory-policy,
        noeviction,
      ]
    volumes: ["redis:/data"]
  meilisearch:
    image: getmeili/meilisearch:v1.35
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_API_KEY:-local-search-development-key}
      MEILI_NO_ANALYTICS: "true"
    ports: ["127.0.0.1:7700:7700"]
    volumes: ["search:/meili_data"]
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: commerce_local
      MINIO_ROOT_PASSWORD: commerce_local_password
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["media:/data"]
  mailpit:
    image: axllent/mailpit:v1.29
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
volumes:
  postgres:
  redis:
  search:
  media:
