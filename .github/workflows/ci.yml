name: Commerce quality
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: commerce
          POSTGRES_PASSWORD: commerce_dev
          POSTGRES_DB: commerce_test
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U commerce -d commerce_test" --health-interval 5s --health-timeout 5s --health-retries 15
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
    env:
      DATABASE_URL: postgresql://commerce:commerce_dev@localhost:5432/commerce_test
      TEST_DATABASE_URL: postgresql://commerce:commerce_dev@localhost:5432/commerce_test
      REDIS_URL: redis://localhost:6379
      DEMO_MODE: "true"
      ALLOW_DEMO_SEED: "true"
      MOCK_WEBHOOK_SECRET: test-only-webhook-secret-change-in-production
      API_URL: http://localhost:4000
      APP_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.25.0 }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate && pnpm db:migrate && pnpm db:seed
      - run: pnpm typecheck && pnpm lint && pnpm test && pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: HTTP commerce and browser flows
        shell: bash
        run: |
          node apps/api/dist/main.js > api.log 2>&1 &
          API_PID=$!
          pnpm --filter @commerce/web start > web.log 2>&1 &
          WEB_PID=$!
          trap 'kill "$API_PID" "$WEB_PID" || true' EXIT
          node scripts/wait-for-services.mjs
          QA_ALLOW_MUTATION=true node --import tsx scripts/qa-api.ts
          pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-artifacts
          path: |
            playwright-report
            test-results
            api.log
            web.log
